[project]
name = "carbonblackappcontrol"
version = "3.1.4"
description = "This app supports various investigative and containment actions on Carbon Black App Control (formerly Bit9)"
license = "Copyright (c) 2016-2026 Splunk Inc."
requires-python = ">=3.13,<3.15"
dependencies = ["splunk-soar-sdk==6.1.2"]

[tool.soar.app]
main_module = "src.app:app"

[tool.ruff]
target-version = "py313"
line-length = 145

[tool.ruff.lint]
select = ["ERA", "S", "DTZ", "SIM", "PTH", "E", "F", "W", "PL", "UP", "RUF"]
ignore = ["E501", "RUF012", "RUF001"]

[tool.ruff.lint.per-file-ignores]
"src/actions/__init__.py" = ["F401"]

[tool.ruff.format]
docstring-code-format = true
